    <title>Model Optimisation Tracker</title>
    <script>
      // Apply the stored appearance before first paint (theme.ts does the same once loaded).
      try {
        var a = localStorage.getItem('mot.appearance');
        var m = {
          'mission-light': ['light', 'mission'],
          rose: ['light', 'rose'],
          slate: ['dark', 'slate'],
          nocturne: ['dark', 'nocturne'],
          coral: ['light', 'coral'],
          sage: ['light', 'sage'],
          graphite: ['dark', 'graphite'],
        }[a];
        if (!a && localStorage.getItem('mot.theme') === 'light') m = ['light', 'mission'];
        if (m) {
          document.documentElement.setAttribute('data-theme', m[0]);
          document.documentElement.setAttribute('data-skin', m[1]);
        }
      } catch (e) {}

    <title>Model Optimisation Tracker</title>
    <script>
      // Apply the stored appearance before first paint (theme.ts does the same once loaded).
      try {
        // Two appearances: Telemetry (dark, the default set on <html>) and Rose (light). Removed light
        // appearances and the legacy light theme fall back to Rose; everything else stays Telemetry.
        var a = localStorage.getItem('mot.appearance');
        var light = a === 'rose' || a === 'mission-light' || a === 'coral' || a === 'sage' || (!a && localStorage.getItem('mot.theme') === 'light');
        if (light) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.setAttribute('data-skin', 'rose');
          document.documentElement.removeAttribute('data-variant');
        }
      } catch (e) {}
    </script>
